[package]
name = "knobd"
version = "0.1.0"
edition = "2021"
description = "Desktop daemon for the Claude Knob: tracks Claude Code sessions and focuses their terminal windows"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5.4"
tao = { version = "0.37", optional = true }
tray-icon = { version = "0.26", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSAppleScript", "NSAppleEventDescriptor", "NSArray", "NSDictionary", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
core-graphics = "0.25"
core-foundation = "0.10"

[features]
default = ["tray"]
# Menu-bar icon for `knobd run`. Build with --no-default-features for a headless daemon.
tray = ["dep:tao", "dep:tray-icon"]
