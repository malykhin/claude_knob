name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host (knobd)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (headless, no menu-bar UI)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test
      - name: Build the app bundle
        run: ./scripts/bundle-macos.sh

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [t-knob, t-encoder-pro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/${{ matrix.board }}/.pio/libdeps
          key: pio-${{ matrix.board }}-${{ hashFiles(format('firmware/{0}/platformio.ini', matrix.board)) }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -d firmware/${{ matrix.board }}
